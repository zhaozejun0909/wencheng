[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wen-douyin-monitor"
version = "0.1.0"
description = "Local Douyin competitor monitoring demo for macOS and Android devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "openpyxl>=3.1,<4",
  "pillow>=10,<13",
]

[project.optional-dependencies]
appium = ["Appium-Python-Client>=4.5,<6"]
ocr = ["rapidocr_onnxruntime>=1.4,<2"]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
wen = "wen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wen"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
