<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文成 · 数据监查</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    body { max-width: 1080px; margin: 0 auto; padding: 28px 18px 60px; background: #f6f7f9; color: #1f2937; }
    .card { background: #fff; border-radius: 14px; padding: 20px; margin: 16px 0; box-shadow: 0 4px 18px #0000000d; }
    h1 { margin-bottom: 4px; } h2 { margin-top: 0; } .muted { color: #6b7280; }
    label { display: block; margin: 10px 0 5px; font-weight: 600; }
    input, textarea, select, button { font: inherit; padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 8px; }
    input, textarea { width: min(620px, 100%); box-sizing: border-box; }
    textarea { display: block; resize: vertical; }
    select { min-width: 160px; }
    button { cursor: pointer; background: #111827; color: white; border-color: #111827; margin: 8px 6px 0 0; }
    button.secondary { background: white; color: #111827; }
    button.danger { background: #b91c1c; border-color: #b91c1c; }
    pre { white-space: pre-wrap; background: #111827; color: #d1fae5; padding: 14px; border-radius: 8px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; } th, td { padding: 8px; border-bottom: 1px solid #e5e7eb; text-align: left; vertical-align: top; }
    .group-row { display: flex; align-items: center; gap: 14px; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; margin: 10px 0; cursor: pointer; }
    .group-row > input { flex: 0 0 auto; width: 18px; height: 18px; }
    .group-summary { flex: 1 1 auto; min-width: 0; }
    .group-summary strong { display: block; margin-bottom: 4px; font-size: 16px; }
    .group-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    .group-actions button { margin: 0; }
    .precise-panel { margin-top: 12px; padding: 14px; border: 1px solid #dbe3ef; border-radius: 12px; background: #f8fafc; }
    .catalog-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .catalog-toolbar button { margin-top: 0; }
    .catalog-status { margin-bottom: 10px; }
    .catalog-search { width: min(520px, 100%); margin-top: 10px; }
    .catalog-picker { margin-top: 10px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
    .catalog-picker-header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 9px 10px; border-bottom: 1px solid #e5e7eb; }
    .catalog-picker-header button { margin-top: 0; padding: 6px 9px; }
    .catalog { max-height: 520px; overflow: auto; }
    .catalog label { display: flex; align-items: flex-start; gap: 8px; width: 100%; box-sizing: border-box; font-weight: 400; padding: 12px 10px; margin: 0; border-bottom: 1px solid #f0f0f0; cursor: pointer; user-select: none; }
    .catalog label:last-child { border-bottom: 0; }
    .catalog input { width: auto; margin-right: 8px; }
    .module { border-left: 4px solid #111827; padding-left: 14px; margin: 18px 0; }
    .module h3 { margin: 0 0 8px; }
    .module-condition { font-weight: 600; color: #374151; margin-bottom: 8px; }
    .warn { margin: 8px 0; padding: 10px 12px; border-radius: 8px; background: #fef2f2; color: #991b1b; white-space: pre-wrap; }
    .result-time { color: #6b7280; margin-top: 4px; }
    .price-value { color: #dc2626; font-weight: 700; }
    .result-actions { margin: 6px 0 16px; }
    .button-link { display: inline-block; padding: 9px 11px; margin: 0 8px 8px 0; border-radius: 8px; background: #111827; color: white; text-decoration: none; }
    .button-link.secondary-link { background: white; color: #111827; border: 1px solid #d1d5db; }
    .history-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
    .history-row:last-child { border-bottom: 0; }
    .history-main { flex: 1; min-width: 0; }
    .history-main strong { display: block; margin-bottom: 4px; }
    .history-summary { color: #4b5563; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .history-actions a, .history-actions button { margin: 0; padding: 6px 9px; font-size: 14px; }
    .history-pagination { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
    .history-pagination button { margin: 0; padding: 6px 10px; }
    .query-progress { margin: 0 0 16px; background: #f8fafc; border: 1px solid #dbe3ef; }
    .query-progress-head { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .query-progress-list { margin-top: 10px; }
    .progress-row { display: flex; align-items: flex-start; gap: 9px; padding: 8px 0; border-top: 1px solid #e5e7eb; }
    .progress-icon { flex: 0 0 auto; width: 18px; text-align: center; }
    .progress-detail { flex: 1; min-width: 0; }
    .progress-detail strong { display: block; }
    .progress-detail small { color: #6b7280; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #cbd5e1; border-top-color: #111827; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
    .progress-row.done .progress-icon { color: #047857; }
    .progress-row.failed .progress-icon { color: #b91c1c; }
    .progress-row.stopped .progress-icon { color: #6b7280; }
    button:disabled { cursor: wait; opacity: .6; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 700px) { .history-row { align-items: flex-start; flex-direction: column; gap: 6px; } }
    dialog { width: min(900px, calc(100vw - 36px)); max-width: 900px; border: 0; border-radius: 14px; padding: 0; box-shadow: 0 18px 60px #0006; }
    dialog::backdrop { background: #11182799; }
    .dialog-body { padding: 20px; }
    .dialog-body h3 { margin-top: 0; }
    #shareLinkDialog { max-width: 620px; }
    .field-title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 10px 0 5px; }
    .field-title-row label { margin: 0; }
    .field-title-row button { margin: 0; padding: 6px 9px; font-size: 14px; }
    @media (max-width: 700px) {
      .group-row { flex-wrap: wrap; }
      .group-summary { flex-basis: calc(100% - 48px); }
      .group-actions { width: 100%; justify-content: flex-start; }
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .editor-card { border: 2px solid #111827; background: #fafafa; padding: 20px; margin: 16px 0; border-radius: 12px; }
    .condition-actions { margin-top: 16px; }
    .device-settings { margin-top: 18px; border: 1px solid #e5e7eb; border-radius: 10px; background: #fafafa; }
    .device-settings summary { cursor: pointer; padding: 12px 14px; font-weight: 600; }
    .device-settings-body { padding: 0 14px 14px; }
    .device-settings-body button { margin-top: 10px; }
    .start-query { display: block; width: 100%; padding: 14px 16px; font-size: 18px; font-weight: 700; margin-top: 14px; }
    .stop-query { display: inline-block; width: auto; padding: 9px 14px; font-size: inherit; font-weight: 600; margin: 8px 0 14px; }
    /* Author-level display rules must not override the native hidden state. */
    #stopQueryButton[hidden], #catalogStop[hidden] { display: none !important; }
    .status { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #f3f4f6; color: #4b5563; }
    .status.error { background: #fef2f2; color: #991b1b; }
  </style>
</head>
<body>
  <h1>文成 · 数据监查</h1>
  <div class="muted">查抖音数据还是挺费劲的～</div>

  <dialog id="catalogDialog">
    <div class="dialog-body">
      <h3>选择要跟踪的商品</h3>
      <p class="muted">可以搜索商品名称，也可以全选当前筛选结果。勾选状态会在关闭弹窗后保留。</p>
      <input id="catalogSearch" class="catalog-search" placeholder="按商品名称筛选" oninput="renderCatalog()" />
      <div id="catalogPicker" class="catalog-picker">
        <div class="catalog-picker-header">
          <span id="catalogCount" class="muted">尚未读取商品</span>
          <button class="secondary" onclick="selectVisibleCatalog()">全选当前列表</button>
          <button class="secondary" onclick="clearCatalogSelection()">清空选择</button>
        </div>
        <div id="catalogList" class="catalog"></div>
      </div>
      <div class="toolbar">
        <button onclick="closeCatalogDialog()">完成选择</button>
        <button class="secondary" onclick="closeCatalogDialog()">关闭</button>
      </div>
    </div>
  </dialog>

  <dialog id="shareLinkDialog">
    <div class="dialog-body">
      <h3>从分享链接提取商品 ID</h3>
      <label for="shareLinkText">分享链接或完整分享内容</label>
      <textarea id="shareLinkText" rows="6" placeholder="粘贴后将自动识别" onpaste="scheduleShareProductIdExtraction()"></textarea>
      <div id="shareLinkStatus" class="status" hidden aria-live="polite"></div>
      <div class="toolbar">
        <button class="secondary" onclick="closeShareLinkDialog()">取消</button>
      </div>
    </div>
  </dialog>

  <section class="card">
    <h2>查询条件</h2>
    <p class="muted">按你的想法设置需要查询的商品，点击「新增查询条件」试试吧</p>
    <div class="editor-card" id="editorCard" hidden>
      <h2 id="editorTitle">新增查询条件</h2>
      <input id="groupId" type="hidden" />
      <input id="groupName" type="hidden" />
      <label for="selectionMode">商品查询方式</label>
      <select id="selectionMode" onchange="toggleMode()">
        <option value="precise" selected>精准查询</option>
        <option value="favorites">查询我收藏的商品</option>
        <option value="range">查询店铺内的商品</option>
      </select>
      <div id="storeOptions">
        <label for="storeLocatorMode">店铺定位方式</label>
        <select id="storeLocatorMode" onchange="toggleStoreLocator()">
          <option value="name">店铺名称</option>
          <option value="sec_shop_id">sec_shop_id（直达）</option>
        </select>
        <div id="storeNameOptions">
          <label for="storeName">店铺名称 <small style="color:#b91c1c;font-weight:400">「请注意不能写错店名，必须和抖音完全一样」</small></label>
          <input id="storeName" placeholder="例如：鸭鸭童装官方旗舰店" />
        </div>
        <div id="secShopIdOptions" hidden>
          <label for="secShopId">sec_shop_id</label>
          <input id="secShopId" placeholder="例如：njBWlyXQ" autocomplete="off" />
        </div>
      </div>
      <div id="favoritesOptions" class="precise-panel" hidden>
        <div class="catalog-status muted">将读取账号“我的收藏”中的全部商品，并自动排除已失效、已下架或不可购买的商品。</div>
      </div>
      <div id="rangeOptions">
        <label for="sortMode">排序方式</label>
        <select id="sortMode">
          <option value="comprehensive">综合</option>
          <option value="sales">销量</option>
          <option value="newest">上新</option>
          <option value="price_asc">价格升序</option>
          <option value="price_desc">价格降序</option>
        </select>
        <label for="limitCount">查询商品数量</label>
        <input id="limitCount" type="number" min="1" max="500" value="10" />
      </div>
      <div id="preciseStoreOptions" class="precise-panel" hidden>
        <div id="catalogStatus" class="catalog-status muted" aria-live="polite">请点击下方按钮拉取店铺完整商品，然后选取想要查询的商品</div>
        <div class="toolbar">
          <button id="catalogChoose" class="secondary" onclick="chooseCatalog()">选择商品</button>
          <button id="catalogStop" class="secondary danger" hidden onclick="stopCatalogRead()">停止读取</button>
        </div>
      </div>
      <div id="productIdOptions" class="precise-panel" hidden>
        <div class="field-title-row">
          <label for="productIds">商品 ID</label>
          <button type="button" class="secondary" onclick="openShareLinkDialog()">从分享链接提取商品 ID</button>
        </div>
        <textarea id="productIds" rows="5" placeholder="输入多个商品 ID，可用逗号或换行分隔"></textarea>
      </div>
      <div class="toolbar">
        <button onclick="saveGroup()">保存查询条件</button>
        <button class="secondary" onclick="closeEditor()">取消</button>
      </div>
      <div id="output" class="status" hidden></div>
    </div>
    <div id="groups"></div>
    <div class="condition-actions">
      <button class="secondary" onclick="openNewEditor()">＋新增查询条件</button>
    </div>
    <div id="conditionStatus" class="status" hidden aria-live="polite"></div>
    <button id="startQueryButton" class="start-query" onclick="runSelectedGroups()">开始查询</button>
  </section>

  <section class="card" id="resultsCard" hidden>
    <h2>本次查询结果</h2>
    <div id="queryProgress" class="query-progress status" hidden aria-live="polite"></div>
    <button id="stopQueryButton" class="stop-query danger" hidden onclick="stopCurrentQuery()">停止查询</button>
    <div id="resultActions" class="result-actions" hidden></div>
    <div id="results"></div>
  </section>

  <section class="card" id="historyCard" hidden>
    <h2>查询记录</h2>
    <div id="history" class="muted">正在读取查询记录…</div>
  </section>

  <script id="initialGroups" type="application/json"></script>
  <script>
    const output = document.getElementById('output');
    const editorCard = document.getElementById('editorCard');
    const editorTitle = document.getElementById('editorTitle');
    const queryProgress = document.getElementById('queryProgress');
    const startQueryButton = document.getElementById('startQueryButton');
    const stopQueryButton = document.getElementById('stopQueryButton');
    const catalogStopButton = document.getElementById('catalogStop');
    const deviceOutput = document.getElementById('deviceOutput');
    const groupsEl = document.getElementById('groups');
    const resultsCard = document.getElementById('resultsCard');
    const historyCard = document.getElementById('historyCard');
    const historyEl = document.getElementById('history');
    let groups = [];
    let catalogProducts = [];
    let catalogComplete = false;
    // A title alone is not a stable identity: two cards may have the same
    // title but different prices.  The picker therefore tracks title+price.
    let selectedCatalogKeySet = new Set();
    let selectedGroupIdSet = new Set();
    let historyPage = 1;
    const historyPageSize = 5;
    let historyCurrentItemCount = 0;
    let activeJobId = null;
    let catalogJobId = null;
    let catalogReadInFlight = false;
    let catalogCancelRequested = false;
    let stopRequested = false;
    let shareExtractTimer = null;
    let shareExtractSequence = 0;
    const stoppingJobIds = new Set();

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[char]));
    }
    function setEditorStatus(message, kind = 'info') {
      output.textContent = message;
      output.hidden = !message;
      output.className = `status ${kind}`;
    }
    function setConditionStatus(message, kind = 'info') {
      const element = document.getElementById('conditionStatus');
      element.textContent = message;
      element.hidden = !message;
      element.className = `status ${kind}`;
    }
    function describeJobResult(result) {
      const labels = {queued:'排队中', running:'采集中', succeeded:'已完成', failed:'失败', paused:'已暂停', stopped:'已停止'};
      const details = [];
      if (result.errors?.length) details.push(`错误：${result.errors.join('；')}`);
      if (result.warnings?.length) details.push(`提示：${result.warnings.join('；')}`);
      if (result.store_candidates?.length) details.push(`候选店铺：${result.store_candidates.join('、')}`);
      if (result.evidence_dir) details.push(`证据目录：${result.evidence_dir}`);
      if (!details.length) details.push(`状态：${result.state || '未返回详细状态'}`);
      return `任务${labels[result.status] || result.status || '结束'}（${result.state || '未知阶段'}）：${details.join('；')}`;
    }
    function toggleMode() {
      const mode = document.getElementById('selectionMode').value;
      const precise = mode === 'precise';
      const favorites = mode === 'favorites';
      document.getElementById('storeOptions').hidden = favorites || precise;
      document.getElementById('favoritesOptions').hidden = !favorites;
      document.getElementById('rangeOptions').hidden = precise || favorites;
      document.getElementById('preciseStoreOptions').hidden = true;
      document.getElementById('productIdOptions').hidden = !precise;
      toggleStoreLocator();
    }
    function toggleStoreLocator() {
      const direct = document.getElementById('storeLocatorMode').value === 'sec_shop_id';
      document.getElementById('storeNameOptions').hidden = direct;
      document.getElementById('secShopIdOptions').hidden = !direct;
    }
    function parseProductIds() {
      return document.getElementById('productIds').value
        .split(/[,，\s]+/)
        .map(value => value.trim())
        .filter(Boolean);
    }
    function setShareLinkStatus(message, kind = 'info') {
      const element = document.getElementById('shareLinkStatus');
      element.textContent = message;
      element.hidden = !message;
      element.className = `status ${kind}`;
    }
    function openShareLinkDialog() {
      const dialog = document.getElementById('shareLinkDialog');
      const input = document.getElementById('shareLinkText');
      input.value = '';
      input.disabled = false;
      setShareLinkStatus('');
      dialog.showModal();
      requestAnimationFrame(() => input.focus());
    }
    function closeShareLinkDialog() {
      clearTimeout(shareExtractTimer);
      shareExtractSequence += 1;
      const dialog = document.getElementById('shareLinkDialog');
      if (dialog.open) dialog.close();
    }
    function scheduleShareProductIdExtraction() {
      clearTimeout(shareExtractTimer);
      // paste 事件触发时浏览器尚未把剪贴板内容写入 textarea，下一轮再读取。
      shareExtractTimer = setTimeout(extractProductIdFromShare, 0);
    }
    async function extractProductIdFromShare() {
      const input = document.getElementById('shareLinkText');
      const shareText = input.value.trim();
      if (!shareText) return;
      const sequence = ++shareExtractSequence;
      input.disabled = true;
      setShareLinkStatus('正在识别商品 ID…');
      try {
        const response = await fetch('/api/product-id/extract', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({share_text: shareText}),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || !payload.product_id) {
          throw new Error(payload.detail || '没有提取到商品 ID。');
        }
        if (sequence !== shareExtractSequence) return;
        const productIds = parseProductIds();
        if (!productIds.includes(payload.product_id)) productIds.push(payload.product_id);
        document.getElementById('productIds').value = productIds.join('\n');
        setEditorStatus(`已提取商品 ID：${payload.product_id}`);
        closeShareLinkDialog();
      } catch (error) {
        if (sequence !== shareExtractSequence) return;
        input.disabled = false;
        setShareLinkStatus(error.message || '分享链接识别失败，请重试。', 'error');
        input.focus();
      }
    }
    function newGroup() {
      document.getElementById('groupId').value = '';
      document.getElementById('groupName').value = '';
      document.getElementById('storeName').value = '';
      document.getElementById('storeLocatorMode').value = 'name';
      document.getElementById('secShopId').value = '';
      document.getElementById('selectionMode').value = 'precise';
      document.getElementById('productIds').value = '';
      document.getElementById('sortMode').value = 'comprehensive';
      document.getElementById('limitCount').value = 10;
      catalogProducts = [];
      catalogComplete = false;
      document.getElementById('catalogList').hidden = true;
      document.getElementById('catalogList').innerHTML = '';
      document.getElementById('catalogPicker').hidden = true;
      document.getElementById('catalogSearch').value = '';
      document.getElementById('catalogSearch').hidden = true;
      selectedCatalogKeySet = new Set();
      closeCatalogDialog();
      document.getElementById('catalogStatus').textContent = '请点击下方按钮拉取店铺完整商品，然后选取想要查询的商品';
      const catalogChoose = document.getElementById('catalogChoose');
      catalogChoose.disabled = false;
      catalogChoose.textContent = '选择商品';
      catalogStopButton.hidden = true;
      catalogStopButton.disabled = false;
      catalogStopButton.textContent = '停止读取';
      setEditorStatus('');
      toggleMode();
    }
    function openNewEditor() {
      if (catalogReadInFlight) {
        setConditionStatus('商品目录读取正在停止，请稍候…');
        return;
      }
      setConditionStatus('');
      newGroup();
      editorTitle.textContent = '新增查询条件';
      editorCard.hidden = false;
      editorCard.scrollIntoView({behavior: 'smooth', block: 'start'});
    }
    function closeEditor() {
      const catalogStillRunning = catalogReadInFlight || Boolean(catalogJobId);
      if (catalogStillRunning) {
        catalogCancelRequested = true;
        setConditionStatus('已取消新增，正在停止商品目录读取…');
        void stopCatalogRead();
      } else {
        setConditionStatus('');
      }
      editorCard.hidden = true;
      newGroup();
    }
    function editGroup(group) {
      document.getElementById('groupId').value = group.id;
      document.getElementById('groupName').value = group.name;
      document.getElementById('storeName').value = group.store_name || '';
      document.getElementById('storeLocatorMode').value = group.store_locator_mode || 'name';
      document.getElementById('secShopId').value = group.sec_shop_id || '';
      document.getElementById('selectionMode').value = group.selection_mode;
      document.getElementById('productIds').value = (group.product_ids || []).join(', ');
      document.getElementById('sortMode').value = group.sort_mode;
      document.getElementById('limitCount').value = group.limit_count;
      const savedSelections = group.selected_products?.length
        ? group.selected_products
        : (group.selected_product_titles || []).map(title => ({title, price: null}));
      catalogProducts = savedSelections.map((selection, index) => ({...selection, __catalogIndex: index}));
      // Saved conditions only contain selected titles; the next click refreshes
      // the complete store catalog before showing the picker.
      catalogComplete = false;
      renderCatalog(savedSelections);
      document.getElementById('catalogStatus').textContent = catalogProducts.length
        ? `已选择 ${selectedCatalogKeySet.size} 个商品，总共 ${catalogProducts.length} 个商品`
        : '请点击下方按钮拉取店铺完整商品，然后选取想要查询的商品';
      toggleMode();
      editorTitle.textContent = '编辑查询条件';
      editorCard.hidden = false;
      editorCard.scrollIntoView({behavior: 'smooth', block: 'start'});
    }
    function editGroupById(id) {
      const group = groups.find(item => item.id === id);
      if (group) editGroup(group);
    }
    function rememberSelectedGroups() {
      selectedGroupIdSet = new Set(
        [...document.querySelectorAll('.run-group:checked')].map(input => input.value)
      );
    }
    function toggleGroupCard(event, row) {
      // The whole saved-condition card is selectable, but its action buttons
      // and the checkbox itself keep their native, independent behavior.
      if (event.target?.closest('button, a, input')) return;
      event.preventDefault();
      const input = row.querySelector('.run-group');
      if (!input) return;
      input.checked = !input.checked;
      input.dispatchEvent(new Event('change', {bubbles: true}));
    }
    function renderGroups() {

    async function loadHistory(page = historyPage) {
      try {
        const response = await fetch(`/api/query-runs?page=${page}&page_size=${historyPageSize}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const jobs = Array.isArray(payload) ? payload : (payload.items || []);
        if (!jobs.length) {
          historyCurrentItemCount = 0;
          historyEl.innerHTML = '';
          historyCard.hidden = true;
          return;
        }
        historyCurrentItemCount = jobs.length;
        historyCard.hidden = false;
        historyPage = Number(payload.page || page);
        const total = Number(payload.total ?? jobs.length);
        const pageCount = Math.max(1, Math.ceil(total / historyPageSize));
        const rows = jobs.map(item => {
          const jobIds = item.job_ids || (item.groups || []).map(group => group.job_id);
          const detailHref = `/api/exports/view?job_ids=${encodeURIComponent(jobIds.join(','))}`;
          const xlsxHref = `/api/exports/xlsx?job_ids=${encodeURIComponent(jobIds.join(','))}`;
          const runGroups = item.groups || [];
          const firstConditionName = runGroups[0]?.query_group_name || '未命名查询条件';
          const conditionSummary = runGroups.length > 1
            ? `${firstConditionName} 等 ${runGroups.length} 个查询条件`
            : firstConditionName;
          const knownProductGroups = runGroups.filter(group => group.product_count != null);
          const productCount = knownProductGroups.reduce((sum, group) => sum + Number(group.product_count || 0), 0);
          const productSummary = knownProductGroups.length ? ` · ${productCount} 个商品` : '';
          const warningCount = runGroups.reduce((sum, group) => sum + Number(group.warning_count || 0), 0);
          const warningSummary = warningCount ? ` · ${warningCount} 个异常` : '';
          const statusSummary = ({succeeded:'成功', failed:'失败', stopped:'已停止', running:'查询中'})[item.status] || item.status;
          const actions = item.finished_at
            ? `<a class="button-link secondary-link" href="${detailHref}" target="_blank" rel="noopener">查看结果</a><a class="button-link secondary-link" href="${xlsxHref}">下载 XLSX</a><button class="danger" data-run-id="${escapeHtml(item.id)}" onclick="deleteHistoryRun(this.dataset.runId, this)">删除</button>`
            : '<span class="muted">任务进行中</span>';
          const summary = `${conditionSummary}${productSummary} · ${statusSummary}${warningSummary}`;
          return `<div class="history-row"><div class="history-main"><strong>${escapeHtml(formatHistoryTime(item.finished_at || item.started_at))}</strong><div class="history-summary" title="${escapeHtml(summary)}">${escapeHtml(summary)}</div></div><div class="history-actions">${actions}</div></div>`;
        }).join('');
        const pager = total > historyPageSize
          ? `<div class="history-pagination"><button class="secondary" onclick="loadHistory(${Math.max(1, historyPage - 1)})" ${historyPage <= 1 ? 'disabled' : ''}>上一页</button><span class="muted">第 ${historyPage} / ${pageCount} 页 · 共 ${total} 条</span><button class="secondary" onclick="loadHistory(${Math.min(pageCount, historyPage + 1)})" ${historyPage >= pageCount ? 'disabled' : ''}>下一页</button></div>`
          : '';
        historyEl.innerHTML = rows + pager;
      } catch (error) {
        historyCard.hidden = false;
        historyEl.textContent = '查询记录读取失败，请刷新重试。';
        console.warn('查询记录读取失败', error);
      }
    }

        const response = await fetch('/api/query-runs/' + encodeURIComponent(runId), {method: 'DELETE'});
        if (!response.ok) {

    async function discoverCatalog() {

      const secShopId = document.getElementById('secShopId').value.trim();
      const catalogStatus = document.getElementById('catalogStatus');

        setEditorStatus('请填写 sec_shop_id。', 'error');
        return;
      }
      catalogReadInFlight = true;

      setCatalogButtonLoading(true);
      catalogStatus.textContent = '正在查询店铺完整商品，请稍候…';
      setEditorStatus('正在查询商品目录，请稍候，完成后会打开选择窗口…');

          store_name: storeLocatorMode === 'name' ? storeName : null,
          store_locator_mode: storeLocatorMode,
          sec_shop_id: storeLocatorMode === 'sec_shop_id' ? secShopId : null,
          max_products: 500,
          selection_mode: 'precise_catalog', sort_mode: 'comprehensive'
        })});
        const created = await response.json().catch(() => ({}));
        if (!response.ok || !created.job_id) {

      if (!row) return;
      const terminal = !['queued', 'running'].includes(result?.status);
      row.className = `progress-row ${terminal ? (result.status === 'succeeded' ? 'done' : (result.status === 'stopped' ? 'stopped' : 'failed')) : ''}`;
      row.querySelector('.progress-icon').innerHTML = terminal
        ? (result.status === 'succeeded' ? '✓' : (result.status === 'stopped' ? '■' : '×'))
        : '<span class="spinner" aria-hidden="true"></span>';
      row.querySelector('.progress-detail small').textContent = progressText(result);
    }
    function finishQueryProgress(total, createdCount, stopped = false) {
      const head = queryProgress.querySelector('.query-progress-head');
      if (head) head.innerHTML = stopped
        ? '<span aria-hidden="true">■</span><span>本次查询已停止，停止任务和现场证据已删除</span>'
        : `<span aria-hidden="true">✓</span><span>本次查询完成：${createdCount} / ${total} 条条件已执行</span>`;
      // Terminal state owns the button lifecycle; do this here as well as in
      // runSelectedGroups.finally so an error while refreshing history cannot
      // leave a stale “停止查询” button on screen.
      hideStopButton();
    }
    function showStopButton() {
      stopQueryButton.hidden = false;
      stopQueryButton.disabled = false;
      stopQueryButton.textContent = '停止查询';
    }
    function hideStopButton() {
      stopQueryButton.hidden = true;
      stopQueryButton.disabled = false;
      stopQueryButton.textContent = '停止查询';
    }
    function showCatalogStopButton() {
      catalogStopButton.hidden = false;
      catalogStopButton.disabled = false;
      catalogStopButton.textContent = '停止读取';
    }
    function hideCatalogStopButton() {
      catalogStopButton.hidden = true;
      catalogStopButton.disabled = false;
      catalogStopButton.textContent = '停止读取';
    }
    async function requestStop(jobId) {
      if (!jobId) return;
      stoppingJobIds.add(jobId);
      try {
        const response = await fetch('/api/jobs/' + encodeURIComponent(jobId) + '/stop', {method: 'POST'});
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.detail || `停止请求失败（${response.status}）`);
        }
        return await response.json();
      } catch (error) {
        stoppingJobIds.delete(jobId);
        throw error;
      }
    }
    async function stopCatalogRead() {
      catalogCancelRequested = true;
      if (!catalogJobId) return;
      catalogStopButton.disabled = true;
      catalogStopButton.textContent = '正在停止…';
      document.getElementById('catalogStatus').textContent = '正在停止商品目录读取，请稍候…';
      try {
        await requestStop(catalogJobId);
      } catch (error) {
        catalogCancelRequested = false;
        catalogStopButton.disabled = false;
        catalogStopButton.textContent = '停止读取';
        document.getElementById('catalogStatus').textContent = `停止失败：${error.message}`;
      }
    }
    async function stopCurrentQuery() {
      if (stopRequested) return;
      stopRequested = true;
      stopQueryButton.disabled = true;
      stopQueryButton.textContent = '正在停止…';
      if (activeJobId) {
        try {
          await requestStop(activeJobId);
          setEditorStatus('查询已停止，正在刷新状态…');
        } catch (error) {
          stopRequested = false;
          stopQueryButton.disabled = false;
          stopQueryButton.textContent = '停止查询';
          setEditorStatus(`停止失败：${error.message}`, 'error');
        }
      } else {
        setEditorStatus('已请求停止，等待当前任务退出…');
      }
    }
    async function pollJob(jobId, group = null) {
      let stopWaitStartedAt = null;
      for (;;) {
        const response = await fetch('/api/jobs/' + encodeURIComponent(jobId));
        if (!response.ok) {
          if (stoppingJobIds.has(jobId)) {
            stoppingJobIds.delete(jobId);
            return {status: 'stopped', state: 'deleted'};
          }
          await new Promise(resolve => setTimeout(resolve, 1000));
          continue;
        }
        const result = await response.json();
        if (stoppingJobIds.has(jobId)) {
          stopWaitStartedAt ||= Date.now();
          if (Date.now() - stopWaitStartedAt > 5000) {
            stoppingJobIds.delete(jobId);
            return {status: 'failed', state: 'stop_failed', errors: ['停止请求已返回，但任务仍然存在，请再次停止。']};
          }
          if (group) updateProgress(group, {status: 'stopped', state: 'stopping'});
          await new Promise(resolve => setTimeout(resolve, 500));
          continue;
        }
        if (group) updateProgress(group, result);
        else {
          const message = `商品目录任务：${progressText(result)}`;
          setEditorStatus(message, result.status === 'failed' ? 'error' : 'info');
          const catalogStatus = document.getElementById('catalogStatus');
          if (catalogStatus) catalogStatus.textContent = message;
        }
        if (!['queued', 'running'].includes(result.status)) return result;
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
    }
    function renderModule(group, result) {
      const productIdMode = group.selection_mode === 'precise';
      const scopeName = group.selection_mode === 'favorites'
        ? '我的收藏'
        : productIdMode
        ? '商品 ID 查询'
        : (result?.store?.name || group.store_name || group.sec_shop_id || '店铺查询');
      if (!result) {
        document.getElementById('results').insertAdjacentHTML('beforeend', `<div class="module"><h3>${escapeHtml(scopeName)}</h3><div class="module-condition">查询条件：${escapeHtml(group.name)}</div><p class="warn">任务没有返回结果。</p></div>`);
        return;
      }
      const products = result.products || [];
      const diagnostics = [
        ...(result.errors || []).map(value => `错误：${value}`),
        ...(result.warnings || []).map(value => `提示：${value}`),
      ];
      if (result.missing_product_titles?.length) {
        diagnostics.push(`精准未命中商品（可能已改名或下架）：${result.missing_product_titles.join('、')}`);
      }
      if (result.invalid_favorite_titles?.length) {
        diagnostics.push(`收藏失效商品（已自动排除）：${result.invalid_favorite_titles.join('、')}`);
      }
      const diagnosticsHtml = diagnostics.map(value => `<p class="warn">${escapeHtml(value)}</p>`).join('');
      const collectedAt = formatChinaTime(result.finished_at);
      const html = `<div class="module"><h3>${escapeHtml(scopeName)}</h3>
        <div class="module-condition">查询条件：${escapeHtml(group.name)}</div>
        <div class="muted">状态：${escapeHtml(result.status)} · ${escapeHtml(result.state)} · 商品数：${products.length}</div>
        <div class="result-time">采集时间：${escapeHtml(collectedAt)}</div>
        ${diagnosticsHtml}</div>`;
      document.getElementById('results').insertAdjacentHTML('beforeend', html);
    }
    function formatChinaTime(value) {
      if (!value) return '—';
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return String(value);
      return new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
      }).format(parsed).replace(/\//g, '-');
    }
    function formatHistoryTime(value) {
      if (!value) return '—';
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return String(value);
      const parts = Object.fromEntries(new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai', month: '2-digit', day: '2-digit', weekday: 'short',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
      }).formatToParts(parsed).map(part => [part.type, part.value]));
      return `${parts.month}-${parts.day}（${parts.weekday}）${parts.hour}:${parts.minute}:${parts.second}`;
    }
    function renderResultActions(jobIds) {
      const actions = document.getElementById('resultActions');
      if (!jobIds.length) { actions.hidden = true; actions.innerHTML = ''; return; }
      const params = encodeURIComponent(jobIds.join(','));
      actions.innerHTML = `<a class="button-link" href="/api/exports/view?job_ids=${params}" target="_blank" rel="noopener">查看本次查询结果</a><a class="button-link secondary-link" href="/api/exports/xlsx?job_ids=${params}">下载本次查询 XLSX</a>`;
      actions.hidden = false;
    }
    loadGroups(); loadHistory(); toggleMode();
  </script>
</body>
